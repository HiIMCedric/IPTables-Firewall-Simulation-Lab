name: iptables-firewall-lab

topology:
  nodes:
    # Alpine Linux Firewall Router
    #   eth1 = LAN, eth2 = DMZ, eth3 = WAN
    router:
      kind: linux
      image: alpine:latest
      binds:
        - config/iptables.rules:/etc/iptables/iptables.rules:ro
      exec:
        - apk add --no-cache iptables
        - ip addr add 10.1.1.1/24 dev eth1
        - ip addr add 192.168.10.1/24 dev eth2
        - ip addr add 172.16.1.1/24 dev eth3
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
        - sysctl -w net.ipv4.ip_forward=1
        - iptables-restore /etc/iptables/iptables.rules

    # WAN Layer-2 switch (joins router, wan-client and wan-attacker)
    wan-switch:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache iproute2
        - ip link add name br0 type bridge
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
        - ip link set br0 up

    # LAN Client
    lan-client:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache curl
        - ip addr add 10.1.1.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 10.1.1.1

    # DMZ Web Server
    dmz-server:
      kind: linux
      image: nginx:alpine
      exec:
        - ip addr add 192.168.10.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 192.168.10.1

    # WAN External Client
    wan-client:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache curl netcat-openbsd
        - ip addr add 172.16.1.100/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 172.16.1.1

    # WAN Attacker / Blacklisted Host
    wan-attacker:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache curl
        - ip addr add 172.16.1.200/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 172.16.1.1

  links:
    - endpoints: ["router:eth1", "lan-client:eth1"]
    - endpoints: ["router:eth2", "dmz-server:eth1"]
    - endpoints: ["router:eth3", "wan-switch:eth1"]
    - endpoints: ["wan-client:eth1", "wan-switch:eth2"]
    - endpoints: ["wan-attacker:eth1", "wan-switch:eth3"]
